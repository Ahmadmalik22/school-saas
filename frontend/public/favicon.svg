<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Glowing Circuit Tech Mortarboard Cap -->
  <defs>
    <linearGradient id="nexusCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0099CC" />
    </linearGradient>
  </defs>

  <!-- Top Mortarboard Diamond -->
  <path d="M 50 14 L 92 38 L 50 62 L 8 38 Z" stroke="url(#nexusCyan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Cap Circuit Nodes & Traces -->
  <circle cx="38" cy="27" r="4" fill="#00D2FF" />
  <circle cx="68" cy="33" r="4" fill="#00D2FF" />
  <line x1="38" y1="27" x2="48" y2="27" stroke="url(#nexusCyan)" stroke-width="4" stroke-linecap="round" />

  <!-- Lower Circuit Base Box -->
  <path d="M 26 48 L 26 74 L 74 74 L 74 48" stroke="url(#nexusCyan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Inner Circuit Traces & Nodes -->
  <line x1="36" y1="74" x2="36" y2="58" stroke="url(#nexusCyan)" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="36" cy="56" r="3.5" fill="#00D2FF" />

  <line x1="34" y1="49" x2="52" y2="49" stroke="url(#nexusCyan)" stroke-width="4" stroke-linecap="round" />
  <circle cx="54" cy="49" r="3.5" fill="#00D2FF" />

  <path d="M 48 62 L 62 62 L 62 52 L 72 52" stroke="url(#nexusCyan)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="48" cy="62" r="3.5" fill="#00D2FF" />
  <circle cx="63" cy="74" r="4" fill="#00D2FF" />
</svg>